<div class="e-document-view-container">
    <!-- Top Toolbar -->
    <p-toolbar>
        <div class="p-toolbar-group-left">
            <button pButton type="button" label="Edit Options" class="p-button-text"></button>
            <button pButton type="button" label="Delete" class="p-button-text"></button>
            <button pButton type="button" label="Copy from" class="p-button-text"></button>
            <button pButton type="button" label="Proof" class="p-button-text"></button>
            <button pButton type="button" label="Send Test" class="p-button-text"></button>
            <button pButton type="button" label="View Report" class="p-button-text"></button>
        </div>
    </p-toolbar>

    <!-- Document Content Area -->
    <div class="document-content-area p-3">
        <!-- Document Header -->
        <div class="document-header surface-card p-2 border-round-top">
            <div class="p-d-flex p-jc-between p-ai-center">
                <p-tabView>
                    <p-tabPanel header="Name"></p-tabPanel>
                    <p-tabPanel header="LP01 - MFA Gate"></p-tabPanel>
                    <p-tabPanel header="Edit"></p-tabPanel>
                </p-tabView>
                <div class="view-controls p-d-flex p-ai-center">
                    <p-selectButton [options]="viewOptions" [(ngModel)]="selectedView" optionLabel="icon" optionValue="value">
                        <ng-template let-item>
                            <i [class]="item.icon"></i>
                        </ng-template>
                    </p-selectButton>
                    <button pButton type="button" icon="pi pi-copy" class="p-button-text p-ml-2"></button>
                    <button pButton type="button" icon="pi pi-ellipsis-h" class="p-button-text"></button>
                </div>
            </div>
        </div>

        <div class="surface-card p-3 border-round-bottom">
            <!-- Edit Design Button -->
            <div class="p-mb-3">
                <button pButton type="button" label="Edit Design" (click)="showDialog()"></button>
            </div>

            <!-- Document Preview -->
            <div class="document-preview" [ngClass]="{'mobile-view': selectedView === 'mobile'}">
                <img src="https://via.placeholder.com/800x1100" alt="Document content">
            </div>
        </div>
    </div>
</div>

<app-edit-e-document-dialog [(display)]="displayDialog"></app-edit-e-document-dialog>
