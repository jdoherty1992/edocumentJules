<p-panel header="Edit Options" [toggleable]="true">
    <div class="info-section">
        <div class="info-field">
            <label>Document Type</label>
            <span>Generated</span>
            <small>These are documents generated by Which50 from a Content Template.</small>
        </div>
        <div class="info-field">
            <label>Output Folder</label>
            <span>[VADMIPDF]</span>
        </div>
        <div class="info-field">
            <label>File Name</label>
            <span>[ENAME].document.pdf</span>
        </div>
        <div class="info-field">
            <label>Apply Password</label>
            <i class="pi pi-check-circle"></i>
        </div>
        <div class="info-field">
            <label>File Size</label>
            <span>14 Kb</span>
        </div>
    </div>
</p-panel>
