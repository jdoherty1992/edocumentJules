<p-dialog header="Edit E-Document" [(visible)]="display" [modal]="true" [style]="{width: '50vw'}" [draggable]="false" [resizable]="false" (onHide)="closeDialog()">
  <form [formGroup]="editEDocumentForm">
    <div class="p-fluid p-formgrid p-grid">
      <div class="p-field p-col-12">
        <label for="name">Name</label>
        <input id="name" type="text" pInputText formControlName="name">
      </div>

      <div class="p-field p-col-12">
        <label>Document Type</label>
        <div class="p-formgroup-inline">
          <div class="p-field-radiobutton">
            <p-radioButton name="documentType" value="Generated" formControlName="documentType" inputId="generated"></p-radioButton>
            <label for="generated">Generated</label>
          </div>
          <div class="p-field-radiobutton">
            <p-radioButton name="documentType" value="Auto Imported" formControlName="documentType" inputId="autoImported"></p-radioButton>
            <label for="autoImported">Auto Imported</label>
          </div>
          <div class="p-field-radiobutton">
            <p-radioButton name="documentType" value="Merged" formControlName="documentType" inputId="merged"></p-radioButton>
            <label for="merged">Merged</label>
          </div>
          <div class="p-field-radiobutton">
            <p-radioButton name="documentType" value="Pre-Existing" formControlName="documentType" inputId="preExisting"></p-radioButton>
            <label for="preExisting">Pre-Existing</label>
          </div>
        </div>
        <small>These are documents generated by Which50 from a Content Template</small>
      </div>
    </div>

    <p-tabs>
      <p-tabpanel header="General">
        <p>This is the general tab. You can add any general information here.</p>
      </p-tabpanel>
      <p-tabpanel header="Document Options">
        <div class="p-grid">
          <div class="p-col-12">
            <h5>Security Options</h5>
            <div class="p-field-checkbox">
              <p-toggleSwitch formControlName="assembleDocument"></p-toggleSwitch>
              <label>Assemble Document</label>
              <i class="pi pi-info-circle p-ml-2"></i>
            </div>
            <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="copyContent"></p-toggleSwitch>
                <label>Copy Content</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
            <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="editAnnotations"></p-toggleSwitch>
                <label>Edit Annotations</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
            <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="editContent"></p-toggleSwitch>
                <label>Edit Content</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
            <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="fillFormFields"></p-toggleSwitch>
                <label>Fill Form Fields</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
            <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="allowPrint"></p-toggleSwitch>
                <label>Allow Print</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
          </div>
          <div class="p-col-12">
            <h5>Other Options</h5>
            <div class="p-field-checkbox">
              <p-toggleSwitch formControlName="landscapeOrientation"></p-toggleSwitch>
              <label>Landscape Orientation</label>
              <i class="pi pi-info-circle p-ml-2"></i>
            </div>
             <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="embedFonts"></p-toggleSwitch>
                <label>Embed Fonts</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
            <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="jpegCompressionEnabled"></p-toggleSwitch>
                <label>JPEG Compression Enabled</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
            <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="scaleImages"></p-toggleSwitch>
                <label>Scale Images</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
            <div class="p-field-checkbox">
                <p-toggleSwitch formControlName="generateSinglePagePdf"></p-toggleSwitch>
                <label>Generate Single Page Pdf</label>
                <i class="pi pi-info-circle p-ml-2"></i>
            </div>
          </div>
          <div class="p-col-12">
              <h5>PDF Type</h5>
              <p-select [options]="pdfTypes" formControlName="pdfType" placeholder="Select a PDF Type"></p-select>
          </div>
        </div>
      </p-tabpanel>
    </p-tabs>
  </form>
  <ng-template pTemplate="footer">
    <p-button icon="pi pi-times" (click)="closeDialog()" label="Cancel" styleClass="p-button-text"></p-button>
    <p-button icon="pi pi-check" (click)="save()" label="Save"></p-button>
  </ng-template>
</p-dialog>
